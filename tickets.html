<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
            <h1>Wimbledon booking</h1>
            <p>Upcoming Matches 2027</p>
        </header>
        
        <hr>

        <nav> 
            <a href="index.html">Home</a> |
            <a href="matches.html">Matches</a> |
            <a href="tickets.html">Tickets</a> 
        </nav>

        <hr>

        <form>
            <fieldset>
                <legend>Match Details</legend>
                <label for="match">Select Match: </label>
                <select id="match" name="match">
                    <option value="">--Select a Match--</option>
                    <option value="a-d">C. Alcaraz vs N. Djokovic</option>
                    <option value="j-m">J. Sinner vs D. Medvedev</option>
                    <option value="s-s">I. Swiatek vs A. Sabalenka</option>
                    <option value="f-z">T. Fritz vs A. Zverev</option>
                </select>
                <br><br>
                <label for="category">Ticket Category:</label>
                <select id="category" name="category">
                    <option value="c-c">Centre court</option>
                    <option value="n-1">No.1 court</option>
                    <option value="n-2">No.2 court</option>
                    <option value="g-p">Ground pass</option>
                    <option value="d-s">Debenture Seats</option>
                </select>
            </fieldset>
            <br>
            <fieldset>
                <legend>Customer Details</legend>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name">
                <br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                <br><br>
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone">
                <br><br>
                <label for="tickets">Number of Tickets:</label>
                <input type="number" id="tickets" name="tickets" min="1" max="6">
            </fieldset>
            <br>
            <button type="submit">Confirm Booking</button>
            <button type="reset">Clear Form</button>
        </form>
        <footer>
            <p>&copy; 2027 Wimbledon | Made for Tennis fans</p>
        </footer>
</body>
</html>
